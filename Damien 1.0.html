body{

    text-align:center;
    font-family:Arial;

}

.slider{

    width:400px;
    height:250px;
    overflow:hidden;
    margin:auto;

}

.slides{

    display:flex;
    width:1600px;
    animation:slide 12s infinite;

}

.slides img{

    width:400px;
    height:250px;

}

@keyframes slide{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-400px);
    }

    50%{
        transform:translateX(-800px);
    }

    75%{
        transform:translateX(-1200px);
    }

    100%{
        transform:translateX(0);
    }

}

.btn{

    background-color:blue;
    color:black;
    padding:12px 250px;
    border:none;
    border-radius:5px;
    font-size:180px;

}

p{

    font-size:18px;

}


</style>

</head>
